[workspace]
name = "paper-template"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# ── Default environment: Python for figure scripts ────────────────────────────
[dependencies]
python     = ">=3.11"
matplotlib = "*"
pandas     = "*"

# ── LaTeX feature ─────────────────────────────────────────────────────────────
[feature.latex.dependencies]
tectonic  = "*"
watchexec = "*"

[feature.latex.tasks]
build = "tectonic main.tex"
watch = "watchexec -e tex,bib tectonic main.tex"
clean = "rm -f main.pdf main.aux main.log main.bbl main.blg"

[environments]
default = { features = [],        solve-group = "default" }
latex   = { features = ["latex"], solve-group = "default" }
